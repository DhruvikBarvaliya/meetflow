# =============================================================================
# MeetFlow web client — nginx server block
# =============================================================================
# Installed as /etc/nginx/conf.d/default.conf, which nginx includes inside its
# http{} context. That is why the map below is legal here: map is an http-level
# directive, and conf.d is already inside http.
#
# The client is a static React/Vite bundle. It talks to the API directly over
# CORS (see src/app.ts), so nginx proxies nothing — it serves files, answers the
# history fallback, and sets headers.
# =============================================================================

# Cache policy is computed once, here, instead of with per-location add_header
# directives. add_header does not merge across levels: the moment a location
# declares one, every inherited add_header from the server block is dropped, so
# a per-location cache header would silently strip the security headers below.
# A map keeps all response headers at a single level where they do inherit.
map $uri $meetflow_cache_control {
    # Documents, the service worker, manifests, and anything copied verbatim
    # from client/public keep their names across deploys, so they must be
    # revalidated or a user is pinned to a stale build indefinitely.
    default    "no-cache";

    # Vite writes content-hashed filenames into /assets. The URL changes
    # whenever the bytes change, which is precisely the condition `immutable`
    # asserts — the browser may skip revalidation for a year.
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Version disclosure only helps someone matching a CVE to this deployment.
    server_tokens off;

    # A static bundle is a few hundred kilobytes at most; anything larger is a
    # bug worth surfacing rather than silently accepting.
    client_max_body_size 1m;

    charset utf-8;

    # --- Compression ---------------------------------------------------------
    gzip on;
    # Vary: Accept-Encoding — without it a shared cache can hand a gzipped body
    # to a client that did not ask for one.
    gzip_vary on;
    gzip_proxied any;
    # 6 is the point where extra CPU stops buying meaningful size on JS bundles.
    gzip_comp_level 6;
    # Below ~1KB the gzip envelope can make the response larger.
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf;

    # --- Response headers ----------------------------------------------------
    # `always` so the headers are present on error responses too, which is where
    # a missing X-Content-Type-Options actually matters.
    add_header Cache-Control $meetflow_cache_control always;

    # Stops a JSON or text response from being sniffed into an executable type.
    add_header X-Content-Type-Options "nosniff" always;
    # Belt and braces with the CSP frame-ancestors below, for older browsers.
    add_header X-Frame-Options "DENY" always;
    # Booking links contain business and slug identifiers; never leak the full
    # path to a third-party origin.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Assumes TLS is terminated in front of this container, which the production
    # stack requires: PUBLIC_APP_URL and CORS_ORIGINS must both be https.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # connect-src allows any https origin (and its wss upgrade) because the API
    # host is chosen at build time via VITE_API_BASE_URL and is frequently a
    # different domain from the app. Everything that can execute — scripts,
    # frames, plugins — is still pinned to 'self'.
    # style-src needs 'unsafe-inline': the charting and popover components set
    # inline style attributes, which CSP treats as inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Routes --------------------------------------------------------------
    # Container liveness. Answered by nginx itself so the probe keeps reporting
    # the truth about the server even while the bundle is being replaced.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed build output. `=404` rather than the SPA fallback: a missing asset
    # must fail loudly instead of returning index.html with a text/html type,
    # which is how a stale deploy turns into an unreadable MIME-type error.
    location /assets/ {
        access_log off;
        try_files $uri =404;
    }

    # The SPA shell. Every client-side route (/dashboard, /book/:slug, ...) is a
    # real URL a user can paste or refresh, so unknown paths resolve to
    # index.html and React Router decides what they mean — including its own
    # 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
